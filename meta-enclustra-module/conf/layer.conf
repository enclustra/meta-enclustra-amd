BBPATH .= ":${LAYERDIR}"

BBFILES += " \
${LAYERDIR}/recipes-*/*/*.bb \
${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "enclustra-module"
BBFILE_PATTERN_enclustra-module = "^${LAYERDIR}/"
BBFILE_PRIORITY_enclustra-module = "10"
BBFILE_PATTERN_IGNORE_EMPTY_enclustra-module = "1"

LAYERVERSION = "1"
LAYERSERIES_COMPAT_enclustra-module = "scarthgap"
LAYERDEPENDS_enclustra-module = "xilinx"
