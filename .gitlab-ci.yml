stages:
  - Build

nightly:
  stage: Build
  trigger:
    include:
      - local: .gitlab-ci-templates.yml
      - local: .gitlab-ci-nightly.yml
    strategy: depend
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "nightly"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
