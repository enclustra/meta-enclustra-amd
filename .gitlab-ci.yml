stages:
  - Build

variables:
  BRANCH: "develop"

.build:
  stage: Build
  image: ${CI_REGISTRY}/enclustra-utils
  tags: 
    - docker
  script:
    - env | grep CI_* > ${CI_JOB_NAME_SLUG}.env
    - echo "PROJECT_PATH=${PROJECT_PATH}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "VERSION=${VERSION}" >> ${CI_JOB_NAME_SLUG}.env
  needs:
    - project: $PROJECT_PATH
      job: RefDesBuild_$VERSION
      ref: $BRANCH
      artifacts: true
  artifacts:
    reports:
      dotenv: ${CI_JOB_NAME_SLUG}.env
    name: build_${CI_JOB_ID}
    paths:
      - ./*.zip
    expire_in: 1 day

XU6_Build:
  variables:
    PROJECT_PATH: "Enclustra/bu-sp/mercury/mercury_xu6/mercury_xu6_reference_design/Mercury_XU6_ST1_Reference_Design"
    VERSION: "2024.2_v1.0.2"
  extends: .build
