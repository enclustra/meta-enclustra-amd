stages:
  - Build

variables:
  BRANCH: "develop"

.build:
  stage: Build
  image: ${CI_REGISTRY}/amd-yocto-enclustra:2024.2
  tags: 
    - docker
  script:
    - env | grep CI_* > ${CI_JOB_NAME_SLUG}.env
    - echo "PROJECT_PATH=${PROJECT_PATH}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "VERSION=${VERSION}" >> ${CI_JOB_NAME_SLUG}.env
    - ./setup.yocto.sh binaries_$PRODUCTMODEL_$BASEBOARD.zip $BOOTMODE $MACHINE
    - cp ${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*.wic .
    - cp ${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*.wic.bmap .
  needs:
    - project: $PROJECT_PATH
      job: RefDesBuild_$VERSION
      ref: $BRANCH
      artifacts: true
  artifacts:
    reports:
      dotenv: $CI_JOB_NAME_SLUG.env
    name: build_$PRODUCTMODEL_$BASEBOARD_$BOOTMODE_$CI_JOB_ID
    paths:
      - ./*.wic
      - ./*.wic.bmap
    expire_in: 1 day

XU6_Build:
  extends: .build
  variables:
    PROJECT_PATH: "Enclustra/bu-sp/mercury/mercury_xu6/mercury_xu6_reference_design/Mercury_XU6_ST1_Reference_Design"
    VERSION: "2024.2_v1.0.2"
    BASEBOARD: "ST1"
    MACHINE: "refdes_xu6_st1"
  parallel:
    matrix:
      - PRODUCTMODEL: ["ME-XU6-2CG-1E-D10H", "ME-XU6-4CG-1E-D12", "ME-XU6-4EV-1I-D12E", "ME-XU6-5EV-2I-D12E"]
        BOOTMODE: ["sd", "qspi", "emmc"]
