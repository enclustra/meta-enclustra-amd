.utils:
  tags:
    - docker
  image: ${CI_REGISTRY}/enclustra-utils:latest

.generate:
  extends: .utils
  variables:
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: submodules/RDG
  stage: generate
  script:
    - cd submodules/RDG/
    - python3 -m venv ./venv
    - source ./venv/bin/activate
    - python3 -m pip install --quiet --requirement ./requirements.txt

.release_rules:
  rules:
    # Only run on tags and if the tag name includes the word 'release'.
    # This prevents pipelines from being created when the individual gitlab release jobs create new tags for each module.
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /release/

.release:
  extends: .release_rules
  artifacts:
    expire_in: never

.gitlab_release:
  extends: .release
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Create release for $CI_COMMIT_TAG"
    - env | grep CI_JOB_URL > ${CI_JOB_NAME_SLUG}.env
    - cat ${CI_JOB_NAME_SLUG}.env

.build:
  stage: build
  image: ${CI_REGISTRY}/amd-yocto-enclustra:${TOOL_VERSION}
  tags: 
    - docker
  script:
    - PRODUCTMODEL_UNDERSCORE=${PRODUCTMODEL//-/_} # Replace hyphen with underscore
    - echo "Building for ${PRODUCTMODEL} on ${BASEBOARD} with boot mode ${BOOTMODE}"
    - echo "${PRODUCTMODEL_UNDERSCORE}_${BASEBOARD}_${BOOTMODE}_CI_JOB_URL=${CI_JOB_URL}" >> "${PRODUCTMODEL}_${BASEBOARD}_${BOOTMODE}.env"
    - test -f binaries_${PRODUCTMODEL}_${BASEBOARD}.zip
    - mkdir ${GIT_CLONE_PATH}/binaries_${PRODUCTMODEL}_${BASEBOARD}
    - unzip binaries_${PRODUCTMODEL}_${BASEBOARD}.zip -d ${GIT_CLONE_PATH}/binaries_${PRODUCTMODEL}_${BASEBOARD}
    - BUILDDIR=${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}
    - XSA=$(find ${GIT_CLONE_PATH}/binaries_${PRODUCTMODEL}_${BASEBOARD}/ -type f -name *.xsa)
    - 'echo "XSA: ${XSA}"'
    - 'echo "BUILDDIR: ${BUILDDIR}"'
    - repo init -u "https://github.com/Xilinx/yocto-manifests.git" -b "rel-v2024.2"
    - repo sync
    - . ./setupsdk ${BUILDDIR}
    - bitbake-layers add-layer ${GIT_CLONE_PATH}/meta-enclustra-*
    - cd ${GIT_CLONE_PATH}
    - |
      ./sources/meta-xilinx/meta-xilinx-core/gen-machine-conf/gen-machineconf parse-xsa \
        --hw-description "${XSA}" \
        --require-machine "${MACHINE}" \
        --machine-overrides "enclustra-${BOOTMODE}" \
        --machine-name "${MACHINE}"
    - . ./sources/poky/oe-init-build-env ${BUILDDIR}
    - 'CONF_FILE=$(find "${BUILDDIR}/conf/machine/" -name "${MACHINE}*.conf" | head -n 1)'
    - 'MACHINE_FINAL=$(basename "${CONF_FILE}" .conf)'
    - 'echo "MACHINE_FINAL: ${MACHINE_FINAL}"'
    - 'echo "MACHINE=\"${MACHINE_FINAL}\"" >> "${BUILDDIR}/conf/local.conf"'
    - bitbake-getvar MACHINE
    - bitbake-getvar DL_DIR
    - bitbake-getvar SSTATE_DIR
    - bitbake-getvar BB_ENV_PASSTHROUGH_ADDITIONS
    - bitbake -e ${TARGET} &> ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}-${TARGET}.env
    - bitbake ${TARGET}
    - |
      if [ "${BOOTMODE}" = "qspi" ]; then
        BOOT_BIN=$(find ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/ -type f -name "BOOT-${MACHINE}*.bin")
        BOOT_SCR=${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/boot.scr
        FIT_IMAGE=$(find ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/ -type f -name "fitImage-${TARGET}-${MACHINE}*.bin")
        tar -czvf ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}-image.tar.gz --transform='s|.*/BOOT-.*\.bin.*|boot.bin|' --transform='s|.*/boot\.scr.*|boot.scr|' --transform='s|.*/fitImage.*|fitImage|' ${BOOT_BIN} ${BOOT_SCR} ${FIT_IMAGE}
      else
        WIC_FILE=$(find ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/ -type f -name "${TARGET}-${MACHINE}*.wic")
        BMAP_FILE=$(find ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/ -type f -name "${TARGET}-${MACHINE}*.wic.bmap")
        tar -czvf ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}-image.tar.gz --transform='s!.*/!!' ${WIC_FILE} ${BMAP_FILE}
      fi
  parallel:
    matrix:
      - PRODUCTMODEL: [""]
        BOOTMODE: [""]
  after_script:
    - cat ${PRODUCTMODEL}_${BASEBOARD}_${BOOTMODE}.env
    - rm -rf ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}
  needs:
    - project: $PROJECT_PATH
      job: $REF_JOB_NAME
      ref: $REF
      artifacts: true
  artifacts:
    reports:
      dotenv: ${PRODUCTMODEL}_${BASEBOARD}_${BOOTMODE}.env
    when: always
    name: build_$PRODUCTMODEL_$BASEBOARD_$BOOTMODE_$CI_JOB_ID
    paths:
      - ./*-${TARGET}.env
      - ./*.tar.gz

.collect:
  stage: collect
  extends: .utils
  script:
    - echo "Collecting artifacts from all builds"
    - env | grep CI_JOB_URL > ${CI_JOB_NAME_SLUG}.env
    - cat ${CI_JOB_NAME_SLUG}.env
  artifacts:
    reports:
      dotenv: ${CI_JOB_NAME_SLUG}.env
    name: "${CI_JOB_NAME}_${CI_JOB_ID}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - ./*.tar.gz
