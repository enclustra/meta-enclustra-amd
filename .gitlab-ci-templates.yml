variables:
  BRANCH: "develop"
  TARGET: "petalinux-image-minimal"

.build:
  stage: Build
  image: ${CI_REGISTRY}/amd-yocto-enclustra:2024.2
  tags: 
    - docker
  script:
    - test -f binaries_${PRODUCTMODEL}_${BASEBOARD}.zip
    - env | grep CI_* > ${CI_JOB_NAME_SLUG}.env
    - echo "PROJECT_PATH=${PROJECT_PATH}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "VERSION=${VERSION}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "DL_DIR=${DL_DIR}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "SSTATE_DIR=${SSTATE_DIR}" >> ${CI_JOB_NAME_SLUG}.env
    - echo "BB_ENV_PASSTHROUGH_ADDITIONS=${BB_ENV_PASSTHROUGH_ADDITIONS}" >> ${CI_JOB_NAME_SLUG}.env
    - ./setup.yocto.sh ${GIT_CLONE_PATH}/binaries_${PRODUCTMODEL}_${BASEBOARD}.zip ${BOOTMODE} ${MACHINE}
    - . ./sources/poky/oe-init-build-env ${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}
    - bitbake-getvar DL_DIR
    - bitbake-getvar SSTATE_DIR
    - bitbake-getvar BB_ENV_PASSTHROUGH_ADDITIONS
    - bitbake -e ${TARGET} &> ${GIT_CLONE_PATH}/${TARGET}.env
    - bitbake ${TARGET}
    - WIC_FILE=$(find ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}/tmp/deploy/images/*/ -type f -name ${TARGET}-${MACHINE}*.wic)
    - tar -czvf ${GIT_CLONE_PATH}/${BOOTMODE}-image.tar.gz --transform='s!.*/!!' ${WIC_FILE}
  parallel:
    matrix:
      - PRODUCTMODEL: [""]
        BOOTMODE: [""]
  after_script:
    - cat ${CI_JOB_NAME_SLUG}.env
    - rm -rf ${GIT_CLONE_PATH}/${PRODUCTMODEL}-${BASEBOARD}-${BOOTMODE}
  needs:
    - project: $PROJECT_PATH
      job: RefDesBuild_$VERSION
      ref: $BRANCH
      artifacts: true
  artifacts:
    when: always
    name: build_$PRODUCTMODEL_$BASEBOARD_$BOOTMODE_$CI_JOB_ID
    paths:
      - ./${TARGET}.env
      - ./*.tar.gz

.collect:
  stage: Collect
  image: ${CI_REGISTRY}/enclustra-utils:latest
  tags: 
    - docker
  script:
    - echo "Collecting artifacts from all builds"
  artifacts:
    name: "${CI_JOB_NAME}_${CI_JOB_ID}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - ./*.tar.gz